<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Seira{% endblock %} · Seira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 44"><circle cx="11" cy="14" r="9" fill="none" stroke="%23D4AF37" stroke-width="1.6"/><circle cx="19" cy="14" r="9" fill="none" stroke="%23D4AF37" stroke-width="1.6"/><circle cx="15" cy="14" r="1.8" fill="%23F0CE5E"/><line x1="15" y1="16" x2="15" y2="42" stroke="%23D4AF37" stroke-width="1.4"/></svg>'>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block bodyclass %}{% endblock %}">
<div class="topbar" id="topbar">
  <a href="/" aria-label="Seira home">
    <svg class="sigil" viewBox="0 0 30 44" aria-hidden="true">
      <g class="sigil-pulse">
        <circle class="circle" cx="11" cy="14" r="9"/>
        <circle class="circle" cx="19" cy="14" r="9"/>
        <circle class="pt" cx="15" cy="14" r="1.7"/>
      </g>
      <line class="ray" x1="15" y1="16" x2="15" y2="42"/>
    </svg><span class="wordmark">Seira</span>
  </a>
  {% block nav %}
  <div style="position:relative">
    <button class="hamburger" id="navburger" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="tray navtray" id="navtray">
      <a href="/">Speak with her</a>
      <a href="/console">Console</a>
      <a href="/diary">Her Diary</a>
      <form method="post" action="/logout" style="margin:0">
        <button type="submit">Log out</button></form>
    </div>
  </div>
  {% endblock %}
</div>
{% block body %}{% endblock %}
<script>
// Shared top-right nav hamburger (present on every page).
const navburger = document.getElementById('navburger');
const navtray = document.getElementById('navtray');
if (navburger) {
  navburger.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = navtray.classList.toggle('open');
    navburger.setAttribute('aria-expanded', open);
  });
  document.addEventListener('click', (e) => {
    if (!navtray.contains(e.target) && e.target !== navburger) navtray.classList.remove('open');
  });
}
</script>
</body>
</html>
