<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Seira{% endblock %} · Seira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ static_version }}">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v={{ static_version }}">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{ static_version }}">
<meta name="theme-color" content="#0b0712">
<link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
</head>
<body class="{% block bodyclass %}{% endblock %}">
<div class="topbar" id="topbar">
  <a href="/" aria-label="Seira home">
    <img class="sigil markimg" src="/static/seira-logo.svg?v={{ static_version }}" alt="" aria-hidden="true"><span class="wordmark">Seira</span>
  </a>
  {% block nav %}
  <div style="position:relative">
    <button class="hamburger" id="navburger" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="tray navtray" id="navtray">
      <a href="/">Speak with her</a>
      <a href="/projects">Projects</a>
      <a href="/console">Console</a>
      <a href="/archive">Archive</a>
      <a href="/diary">Her Diary</a>
      <a href="/weekly-notes">Her Weekly Notes</a>
      <a href="/commands">Commands</a>
      <a href="/api/export">Export My Seira</a>
      <form method="post" action="/logout" style="margin:0">
        <button type="submit">Log out</button></form>
    </div>
  </div>
  {% endblock %}
</div>
{% block body %}{% endblock %}
<script>
// Shared top-right nav hamburger (present on every page).
const navburger = document.getElementById('navburger');
const navtray = document.getElementById('navtray');
if (navburger) {
  navburger.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = navtray.classList.toggle('open');
    navburger.setAttribute('aria-expanded', open);
  });
  document.addEventListener('click', (e) => {
    if (!navtray.contains(e.target) && e.target !== navburger) navtray.classList.remove('open');
  });
}
</script>
</body>
</html>
