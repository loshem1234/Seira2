{% extends "base.html" %}
{% block bodyclass %}locked{% endblock %}
{% block body %}
<div class="shell" id="shell">
  <div class="backdrop" id="backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <a class="railbrand" href="/" aria-label="Seira home">
      <img class="sigil markimg" src="/static/seira-logo.svg?v={{ static_version }}" alt="" aria-hidden="true">
      <span class="wordmark">Seira</span>
    </a>
    <button class="gold newchat" id="railnew" type="button">+ New conversation</button>
    <div class="convolist" id="railrecent"><div class="railgroup">Recent</div></div>
    <nav class="railnav" aria-label="Sections">
      <a href="/">Speak with her</a>
      <a href="/projects" class="railprojects">Projects</a>
      <a href="/diary">Her Diary</a>
      <a href="/weekly-notes">Her Weekly Notes</a>
      <a href="/archive">Archive</a>
      <a href="/console">Console</a>
      <a href="/commands">Commands</a>
      <a href="/api/export">Export My Seira</a>
      <form method="post" action="/logout"><button type="submit">Log out</button></form>
    </nav>
  </aside>
  <div class="chatcol">
    <header class="chathead">
      <button class="railbtn" id="railbtn" type="button" aria-label="Menu">
        <span></span><span></span><span></span></button>
      <div class="chattitle">{% block pagetitle %}{{ self.title() }}{% endblock %}</div>
    </header>
    <main class="shellmain">{% block content %}{% endblock %}</main>
  </div>
</div>
<script src="/static/rail.js?v={{ static_version }}"></script>
{% endblock %}
